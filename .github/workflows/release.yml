name: Release lstty

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (defaults to github.ref_name)"
        required: false

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust tests
        run: cargo test --manifest-path lstty-rs/Cargo.toml

      - name: Build lstty-rs
        run: cargo build --release --locked --manifest-path lstty-rs/Cargo.toml

      - name: Package Windows release
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          New-Item -ItemType Directory -Force -Path "dist/stage/benchlib" | Out-Null
          Copy-Item "lstty-rs/target/release/lstty.exe" "dist/stage/lstty.exe"
          Copy-Item "lstty.py" "dist/stage/lstty.py"
          Copy-Item "benchlib/__init__.py" "dist/stage/benchlib/__init__.py"
          Copy-Item "benchlib/probelock.py" "dist/stage/benchlib/probelock.py"
          Set-Content -Path "dist/stage/VERSION" -Value $tag -NoNewline -Encoding UTF8

          $zip = "dist/lstty-windows-x86_64.zip"
          Compress-Archive -Path "dist/stage/*" -DestinationPath $zip -Force
          $hash = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLowerInvariant()
          Set-Content -Path "dist/checksums.txt" -Value "$hash  lstty-windows-x86_64.zip" -Encoding UTF8

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          gh release create $tag `
            "dist/lstty-windows-x86_64.zip" `
            "dist/checksums.txt" `
            --title "lstty $tag" `
            --notes "Standalone lstty Windows release." `
            --latest
