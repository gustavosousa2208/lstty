[package]
name = "lstty-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Fast native front end for lstty (listing hot path on Windows and macOS); everything else delegates to lstty.py"

[[bin]]
name = "lstty"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
